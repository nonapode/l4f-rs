[package]
name = "l4-ipc"
description = "L4 IPC: core mechanisms plus feature-selected protocol sets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
l4-ipc-core = { path = "../l4-ipc-core" }
pastey = "0.2.3"

[features]
default = ["base"]

# Protocol sets.  `base` selects the protocols every L4 system provides;
# it currently contains `log`, `factory`, `task` and `kobject`, further
# protocols (sigma0, scheduler, irq, irq_sender, thread) join it as they are
# implemented.
base = ["proto-log", "proto-factory", "proto-task", "proto-kobject"]

# Individual protocols.
proto-log = []
proto-factory = []
proto-task = []
proto-kobject = []

# aarch64 only: enter the kernel with `hvc #0` instead of `svc #0`.
cpu-virt = ["l4-ipc-core/cpu-virt"]
