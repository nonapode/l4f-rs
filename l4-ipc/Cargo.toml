[package]
name = "l4-ipc"
description = "L4 IPC: core mechanisms plus feature-selected protocol sets"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
l4-ipc-core = { path = "../l4-ipc-core" }
pastey = "0.2.3"

[features]
default = ["base"]

# Protocol sets.  `base` selects the protocols every L4 system provides;
# it currently contains `log`, `factory`, `task`, `kobject`, `thread`,
# `ipc_gate`, `thread_group` and `scheduler`, further protocols (sigma0, irq,
# irq_sender) join it as they are implemented.
base = ["proto-log", "proto-factory", "proto-task", "proto-kobject", "proto-thread", "proto-ipc_gate", "proto-thread_group", "proto-scheduler"]

# Individual protocols.
proto-log = []
proto-factory = []
proto-task = []
proto-kobject = []
proto-thread = []
# Binds to a thread, so the thread protocol is needed.
proto-rcv_endpoint = ["proto-thread"]
# A gate is a kobject and a receive endpoint.
proto-ipc_gate = ["proto-kobject", "proto-rcv_endpoint"]
# Adds and removes threads, so the thread protocol is needed.
proto-thread_group = ["proto-thread"]
# Runs threads, so the thread protocol is needed.
proto-scheduler = ["proto-thread"]

# aarch64 only: enter the kernel with `hvc #0` instead of `svc #0`.
cpu-virt = ["l4-ipc-core/cpu-virt"]
